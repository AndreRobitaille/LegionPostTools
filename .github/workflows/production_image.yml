name: Profile production image

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit to compare with this revision
        required: true
        default: 2cb6a64fbb195d4a1af9ac20de7fd4947ac196a5
  push:
    branches: [codex/production-image-memory]

permissions:
  contents: read

concurrency:
  group: production-image-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Measure cold baseline
        env:
          BASELINE: ${{ inputs.baseline || '2cb6a64fbb195d4a1af9ac20de7fd4947ac196a5' }}
        run: bash script/profile_production_image "$BASELINE" baseline "$RUNNER_TEMP/profile/baseline"
      - name: Measure cold production bundle and check runtime
        run: bash script/profile_production_image "$GITHUB_SHA" candidate "$RUNNER_TEMP/profile/candidate"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-image-profile
          path: ${{ runner.temp }}/profile
