name: Build production image

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bin/**'
      - 'config/**'
      - 'db/**'
      - 'lib/**'
      - 'public/**'
      - 'script/**'
      - 'vendor/**'
      - 'test/scripts/**'
      - '.kamal/hooks/**'
      - Dockerfile
      - .dockerignore
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - .github/workflows/production_image.yml
  push:
    branches: [master]
  workflow_dispatch:

# Checkout and artifacts only. No registry write, production secrets or SSH.
permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and smoke-test the actual production image
        run: bash script/build_production_image "$GITHUB_SHA" "$RUNNER_TEMP/production-image"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-image-checks-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/checks
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success() && github.event_name != 'pull_request'
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/image
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
