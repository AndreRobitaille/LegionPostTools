production:
  reconcile_minutes_distribution:
    class: MinutesDistributionReconcileJob
    queue: background
    schedule: every 15 minutes
  expire_mobile_token_responses:
    class: ExpireMobileTokenResponsesJob
    queue: background
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_agent_api_executions:
    class: CleanupAgentApiExecutionsJob
    queue: background
    schedule: every day at 3:17am
  reconcile_endeavor_history:
    class: EndeavorHistoryReconcileJob
    queue: background
    schedule: every 15 minutes
  purge_meeting_transcripts:
    class: PurgeMeetingTranscriptsJob
    queue: background
    schedule: every hour at minute 37
